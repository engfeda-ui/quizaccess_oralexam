<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGradAccess" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#02140e"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="shackleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="glowAccess" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Rounded Square -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bgGradAccess)" stroke="#10b981" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Shield Base Outline & Fill -->
  <path d="M 64 16 L 98 28 C 98 62 84 88 64 104 C 44 88 30 62 30 28 Z" fill="url(#shieldGrad)" stroke="#2dd4bf" stroke-width="2.5" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.5))"/>

  <!-- Inner Shield Glow Accent -->
  <path d="M 64 22 L 92 32 C 92 60 80 82 64 96 C 48 82 36 60 36 32 Z" fill="none" stroke="#5eead4" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Sound Wave Arches inside Shield -->
  <path d="M 49 68 A 18 18 0 0 1 79 68" fill="none" stroke="#a7f3d0" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 44 73 A 24 24 0 0 1 84 73" fill="none" stroke="#a7f3d0" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Small Microphone Icon Base -->
  <rect x="58" y="70" width="12" height="18" rx="6" fill="#f8fafc" opacity="0.9"/>
  <path d="M 54 78 A 10 10 0 0 0 74 78" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <line x1="64" y1="88" x2="64" y2="94" stroke="#f8fafc" stroke-width="2" opacity="0.9"/>

  <!-- Padlock Shackle (Security Access Rule) -->
  <path d="M 52 48 L 52 38 C 52 31.4 57.4 26 64 26 C 70.6 26 76 31.4 76 38 L 76 48" fill="none" stroke="url(#shackleGrad)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Padlock Body -->
  <rect x="46" y="46" width="36" height="26" rx="6" fill="url(#lockGrad)" stroke="#fef3c7" stroke-width="1.5" filter="url(#glowAccess)"/>

  <!-- Padlock Keyhole -->
  <circle cx="64" cy="56" r="3.2" fill="#78350f"/>
  <polygon points="62.5,56 65.5,56 66.5,65 61.5,65" fill="#78350f"/>
</svg>
